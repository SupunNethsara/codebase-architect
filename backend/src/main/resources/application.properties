spring.application.name=backend
server.port=8080

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/codebase-architect
spring.datasource.username=postgres
spring.datasource.password=Admin123

# Password eka local.properties eken enawa (git ekata commit wenne naha).
# "optional:" nisa e file eka nathi unath app eka start wenawa.
# Import karana file ekata precedence wadiy - eeka uda tiyena values overwrite karanawa.
spring.config.import=optional:file:./local.properties

# --- JPA / Hibernate ---
# update = @Entity classes walata match wena widiyata table auto-create/alter wenawa.
# Dev walata hoda, production walata Flyway use karanna.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Hibernate generate karana SQL console eke pennanawa - iganaganna wadagath.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
