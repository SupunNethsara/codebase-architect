spring.application.name=backend
server.port=8080

# --- PostgreSQL ---
# Password eka environment variable ekakin enawa (git ekata commit wenne naha).
# PowerShell: $env:DB_PASSWORD = "your-password"
spring.datasource.url=jdbc:postgresql://localhost:5432/architect
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# update = @Entity classes walata match wena widiyata table auto-create/alter wenawa.
# Dev walata hoda, production walata Flyway/Liquibase use karanna.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Hibernate generate karana SQL console eke pennanawa - iganaganna godak wadagath.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Logging ---
logging.level.org.hibernate.orm.jdbc.bind=trace
