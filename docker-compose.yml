services:
  postgres:
    image: postgres:16-alpine
    container_name: codebase_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codebase_architect}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Admin123}
    volumes:
      - codebase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-codebase_architect}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codebase_network

  redis:
    image: redis:7-alpine
    container_name: codebase_redis
    restart: always
    volumes:
      - codebase_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codebase_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codebase_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-codebase_architect}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-Admin123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - codebase_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codebase_frontend
    restart: always
    ports:
      # Port 80 is completely free on the EC2 host (rag-engine uses 3000, 8080, 5432, 11434)
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - codebase_network

volumes:
  codebase_postgres_data:
  codebase_redis_data:

networks:
  codebase_network:
    driver: bridge
